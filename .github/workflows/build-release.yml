name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build and run checks without audio devices
        run: .\build.ps1 -CI
      - name: Package portable application
        run: .\ci\Package-Release.ps1
      - name: Upload portable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soundboard-lab-windows-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            tests/**/latest-results.txt
            tests/gui-helper-results.txt
            tests/endpoint-install-plan-latest.txt
            tests/preferences-*.png
          if-no-files-found: warn
          retention-days: 14
  release:
    name: Publish GitHub release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download portable build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: soundboard-lab-windows-x64
          path: release
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat release/release-notes.md > release-notes.md
          printf '\n\nPortable Windows x64 build from commit `%s`.\n\n' "$SOURCE_SHA" >> release-notes.md
          printf 'Extract the ZIP and run `SoundboardLab.exe`. The .NET runtime is included.\n\n' >> release-notes.md
          printf 'Includes foreground-app and whole-PC audio forwarding with toggle and push-to-forward hotkeys in Preferences. Microphone mixing requires device setup; this development build is unsigned.\n\n' >> release-notes.md
          printf 'CI validates offline audio processing, native callbacks, services and hidden UI layouts. Physical microphone and live forwarding compatibility require separate checks. Verify the ZIP with `SHA256SUMS.txt`.\n' >> release-notes.md
          if [[ "$SOURCE_REF" == refs/tags/v* ]]; then
            tag="$REF_NAME"
            title="Soundboard Lab $REF_NAME"
            flags=(--verify-tag)
            if [[ "$REF_NAME" == *-* ]]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          else
            tag=preview
            title='Latest development preview'
            flags=(--target "$SOURCE_SHA" --prerelease --latest=false)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$tag" == preview ]]; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/preview" -f sha="$SOURCE_SHA" -F force=true >/dev/null
            fi
            gh release edit "$tag" --title "$title" --notes-file release-notes.md
          else
            gh release create "$tag" --title "$title" --notes-file release-notes.md "${flags[@]}"
          fi
          gh release upload "$tag" release/*.zip release/SHA256SUMS.txt --clobber
